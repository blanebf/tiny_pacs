name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Lint (flake8)
        run: poetry run flake8 tiny_pacs tests

      - name: Type check (mypy)
        run: poetry run mypy tiny_pacs tests

      - name: Tests
        run: poetry run pytest

  extensions:
    name: ${{ matrix.package.name }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        package:
          - name: tiny_pacs_admin
            install: >-
              .
              extensions/tiny_pacs_admin
          - name: tiny_pacs_identity
            install: >-
              .
              extensions/tiny_pacs_admin
              extensions/tiny_pacs_identity
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The extension packages pin the core by version, so the repository
      # packages are installed from the checkout in dependency order. The
      # identity job also installs the admin package: its test suite
      # exercises the interaction with the real DeviceStore component
      # (a test-only dependency; the runtime package does not import it).
      - name: Install core and extensions
        run: pip install ${{ matrix.package.install }}

      - name: Install development tools
        run: pip install "pytest>=9.0,<10" "mypy>=1.0,<2" "flake8>=7.0,<8" ruff

      - name: Lint (ruff)
        run: ruff check .
        working-directory: extensions/${{ matrix.package.name }}

      - name: Lint (flake8)
        run: flake8 --config ../../.flake8 ${{ matrix.package.name }} tests
        working-directory: extensions/${{ matrix.package.name }}

      - name: Type check (mypy)
        run: mypy ${{ matrix.package.name }} tests
        working-directory: extensions/${{ matrix.package.name }}

      - name: Tests
        run: pytest
        working-directory: extensions/${{ matrix.package.name }}

  integration:
    # Entry point discovery is version-independent; the per-version
    # coverage is provided by the extension jobs above.
    name: Extension discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install core and both extensions
        run: >-
          pip install .
          extensions/tiny_pacs_admin
          extensions/tiny_pacs_identity

      - name: Verify entry point discovery
        run: python scripts/verify_entry_points.py

      - name: Smoke-test the extension subcommands
        run: |
          tiny-pacs components list
          tiny-pacs devices list --help
          tiny-pacs db info --help
          tiny-pacs users list --help
