version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
    - method: pip
      path: extensions/tiny_pacs_admin
    - method: pip
      path: extensions/tiny_pacs_identity
    - method: pip
      path: extensions/tiny_pacs_audit
