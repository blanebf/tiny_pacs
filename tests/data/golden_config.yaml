# Generated by "tiny-pacs config generate" — regenerate instead of hand-
# editing. Comments are generated from component and configuration model
# docstrings.

# Application entity settings.
ae:
  # AE title (or a list of AE titles) the server answers to
  ae_title:
  - TINY_PACS
  # SCP TCP port
  port: 11112
  # maximum PDU length in bytes
  max_pdu_length: 65536
  # dump datasets and association PDUs to the log
  dump_ds: true
  # list of supported transfer syntax UIDs
  supported_ts:
  - 1.2.840.10008.1.2
  - 1.2.840.10008.1.2.1
  - 1.2.840.10008.1.2.1.99
  - 1.2.840.10008.1.2.4.50
  - 1.2.840.10008.1.2.4.51
  - 1.2.840.10008.1.2.4.57
  - 1.2.840.10008.1.2.4.70
  - 1.2.840.10008.1.2.4.80
  - 1.2.840.10008.1.2.4.81
  - 1.2.840.10008.1.2.4.90
  - 1.2.840.10008.1.2.4.91
  - 1.2.840.10008.1.2.4.92
  - 1.2.840.10008.1.2.4.93
  - 1.2.840.10008.1.2.4.94
  - 1.2.840.10008.1.2.4.95
  - 1.2.840.10008.1.2.4.100
  - 1.2.840.10008.1.2.4.101
  - 1.2.840.10008.1.2.4.102
  - 1.2.840.10008.1.2.4.103
  - 1.2.840.10008.1.2.4.104
  - 1.2.840.10008.1.2.4.105
  - 1.2.840.10008.1.2.4.106
  - 1.2.840.10008.1.2.4.107
  - 1.2.840.10008.1.2.4.108
  - 1.2.840.10008.1.2.5
  - 1.2.840.10008.1.2.6.1
  - 1.2.840.10008.1.2.6.2
  # TLS settings; all incoming connections are wrapped in TLS when given
  # (optional)
  tls: null

# Python logging configuration, passed to logging.config.dictConfig() — see
# the "Configuration dictionary schema" section of the Python logging
# documentation.
log:
  version: 1
  disable_existing_loggers: false
  formatters:
    simple:
      format: '%(asctime)s - %(levelname)-8s - %(name)-15s - %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: simple
      stream: ext://sys.stdout
  root:
    level: DEBUG
    handlers:
    - console

components:

  # DB component. Handles database connections, transactions, schema version
  # bookkeeping and migrations of all database models. (built-in)
  Database:
    # whether the component is enabled. Components are skipped unless on is
    # true, so the default is false: an entry that omits on does not enable
    # the component. The built-in default components set on explicitly (see
    # tiny_pacs.config.DEFAULT_COMPONENTS).
    'on': true
    # DB driver to use (one of: sqlite, postgres)
    driver: sqlite
    # database (file) name (optional)
    db_name: null
    # connect via URI (SQLite only)
    uri: true
    # SQLite URI open mode (memory, rwc, ...)
    mode: memory
    # maximum number of pooled connections
    max_conn: 20
    # enable the SQLite WAL journal mode (ignored by PostgreSQL)
    wal: true
    # SQLite busy_timeout in milliseconds; how long a blocked write waits
    # for the lock instead of failing with database is locked
    busy_timeout: 10000
    # PostgreSQL host
    host: localhost
    # PostgreSQL port
    port: 5432
    # PostgreSQL user
    user: postgres
    # PostgreSQL password. Stored in plain text; the generated file is
    # written with mode 0600.
    password: postgres

  # Component that keeps remote device configurations. (built-in)
  Devices:
    # whether the component is enabled. Components are skipped unless on is
    # true, so the default is false: an entry that omits on does not enable
    # the component. The built-in default components set on explicitly (see
    # tiny_pacs.config.DEFAULT_COMPONENTS).
    'on': true
    # pre-configured devices by AE title
    devices: {}
    # register calling AE titles automatically
    auto_add: true
    # port used for auto-added devices (0..65535)
    default_port: 11112

  # Component that implements PACS services themselves. (built-in)
  PACS:
    # whether the component is enabled. Components are skipped unless on is
    # true, so the default is false: an entry that omits on does not enable
    # the component. The built-in default components set on explicitly (see
    # tiny_pacs.config.DEFAULT_COMPONENTS).
    'on': true
    # Patient ID values (recognized case-insensitively) treated as de-
    # identification placeholders of incoming datasets. Datasets carrying
    # one of them — like the datasets with an empty Patient ID or with the
    # normative PS3.15 E de-identification attributes — are stored without
    # demographic conflict warnings, because the identity attributes of
    # anonymized data carry no identity semantics (one shared record per
    # distinct Patient ID string).
    anonymous_patient_ids:
    - ANONYMOUS

  # Simple in-memory storage component. Stores all incoming datasets in RAM.
  # Intended for testing only. (built-in)
  InMemoryStorage:
    # whether the component is enabled. Components are skipped unless on is
    # true, so the default is false: an entry that omits on does not enable
    # the component. The built-in default components set on explicitly (see
    # tiny_pacs.config.DEFAULT_COMPONENTS).
    'on': true
    # when true an incoming C-STORE whose SOP Instance UID is already stored
    # replaces the existing instance; when false (the default) such a store
    # is refused with a failure status and the already-stored instance is
    # left untouched. A replacement is only destructive once it succeeded:
    # the stored copy is kept until the incoming dataset is fully stored,
    # and a failed replacement rolls the record back to it. Overwriting
    # replaces the stored dataset and its storage record only; the PACS
    # catalogue keeps the attributes it recorded on the first store of that
    # SOP Instance UID (the archive is keyed by UID, which is unchanged by
    # an overwrite), so this is intended for re-pushing the same instance
    # rather than editing its indexed attributes.
    overwrite: false
